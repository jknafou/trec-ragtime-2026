[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trec-ragtime-2026"
version = "1.0.0"
description = "An agentic multilingual retrieval-augmented pipeline that writes cited English reports, built by BiTeM (HES-SO Geneva) for TREC RAGTIME 2026."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Julien Knafou", email = "julien.knafou@hesge.ch" },
]
keywords = [
  "TREC",
  "RAGTIME",
  "retrieval-augmented generation",
  "multilingual information retrieval",
  "machine translation",
  "report generation",
  "nuggets",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pyarrow>=25.0,<26",          # parquet artifact IO
  "lmdb==2.3.0",                # mmap'd by-id passage store
  "ruamel.yaml>=0.18.6,<0.20",  # YAML 1.2 safe-load, raises on duplicate keys
  "jsonschema>=4.23,<5",        # validates every guided_json response
  "openai>=2.21,<2.25",         # client for the vLLM OpenAI-compatible server
  "huggingface-hub>=1.24,<2",   # byte-exact snapshot download of the raw corpus
  "tokenizers==0.22.2",         # XLM-R budget counting via the bge-m3 tokenizer
]

# The sentence segmenter on its torch-free ONNX backend. Chunking then runs on CPU,
# on macOS and on Linux alike.
[project.optional-dependencies]
chunk = [
  "wtpsplit==2.2.1",
  "onnxruntime",
]
# GPU serving stack, resolved from the cu129 torch index. Linux only.
# transformers 5.5.4 is required: the 4.x series cannot load Qwen3.5. vLLM's own <5
# cap is lifted by the resolver override further down.
heavy = [
  "torch==2.10.0 ; sys_platform == 'linux'",
  "torchvision==0.25.0 ; sys_platform == 'linux'",
  "torchaudio==2.10.0 ; sys_platform == 'linux'",
  "vllm==0.17.1 ; sys_platform == 'linux'",
  "transformers==5.5.4 ; sys_platform == 'linux'",
  # Gated-DeltaNet linear-attention layers plus the flashinfer JIT that builds its kernel.
  "fla-core==0.4.2 ; sys_platform == 'linux'",
  "flash-linear-attention==0.4.2 ; sys_platform == 'linux'",
  "flashinfer-python==0.6.4 ; sys_platform == 'linux'",
  "ninja==1.13.0 ; sys_platform == 'linux'",
  "tokenizers==0.22.2 ; sys_platform == 'linux'",
  "accelerate==1.11.0 ; sys_platform == 'linux'",
  "numpy==2.2.6 ; sys_platform == 'linux'",
  "ctranslate2>=4.8,<5 ; sys_platform == 'linux'",
  "sentence-transformers==5.3.0 ; sys_platform == 'linux'",
  # In the environment every run used, though the only code that imported it has been removed
  # as dead. Kept so `uv.lock` still describes the environment that produced the submissions.
  "FlagEmbedding==1.2.11 ; sys_platform == 'linux'",
  "wtpsplit==2.2.1 ; sys_platform == 'linux'",
]
# Index engines for the three retrieval legs. Additive to `heavy`, never combined
# with `chunk`. faiss stays unmarked because the dense leg is built and searched on CPU.
index = [
  "faiss-cpu==1.14.3",
  "pyseismic-lsr==0.5.1 ; sys_platform == 'linux'",
  "pylate==1.6.0 ; sys_platform == 'linux'",
  # fast-plaid's version suffix encodes its torch pin: 1.4.6.2100 means torch==2.10.0.
  "fast-plaid==1.4.6.2100 ; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/jknafou/trec-ragtime-2026"
Repository = "https://github.com/jknafou/trec-ragtime-2026"
Dataset = "https://huggingface.co/datasets/jknafou/trec-ragtime-2026"
Track = "https://trec-ragtime.github.io/"

[project.scripts]
run = "ragtime.orchestration.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ragtime*"]

# The dispatcher resolves its sbatch templates next to its own module, so they ship
# inside the package. A wheel built without them submits nothing.
[tool.setuptools.package-data]
"ragtime.orchestration.slurm" = ["templates/*.sbatch"]

[tool.uv]
# Lock universally for both development machines and the Linux cluster, so a lock
# resolved on either installs identically on the other.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# vLLM declares transformers<5 and pylate pins ninja==1.11.1.4; both conflict with
# pins this pipeline needs, so they are replaced resolver-wide.
override-dependencies = ["transformers==5.5.4", "ninja==1.13.0 ; sys_platform == 'linux'"]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "small: fast smoke on a tiny fixture",
  "full: full-data gate",
]

[tool.ruff]
line-length = 100
target-version = "py312"
