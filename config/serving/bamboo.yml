# Measured replica-shape calibration, namespaced by serving.shapes.shape_key(model, role).
# These rows are the only sanctioned source of batch knobs for a translate replica; the
# mt.batch_size values in the node rows above come from serving.capacity.mt_capacity() and
# are far too large to use.
#
# semantic_composition_ok is the acceptance test that matters: the fairness-hashed
# composition (bucket_token_budget 16384 x max_sentences_per_bucket 512) is identical on
# every card by construction, so a card that cannot host it is unusable for translate
# however large its own ceiling is. The RTX 3090 fails it, which is why the GPU worker
# template excludes it. A shape is usable once it has a row here; the rows below are the
# calibrated set.
shape_calibration:
  facebook/nllb-200-3.3B@translate:
    bwx1:
      status: proven
      vram_total_gb: 95.593
      gpu_model: nvidia_rtx_pro_6000_blackwell
      max_batch_tokens: 69632
      max_sentences_per_batch: 1024
      peak_gb_long: 42.111
      peak_gb_short: 35.768
      peak_gb_knee: 66.893
      binding_case: knee
      sentences_per_s_mixed_at_accepted: 24.65
      accept_fraction: 0.85
      semantic_composition_ok: true
      semantic_max_batch_tokens: 16384
