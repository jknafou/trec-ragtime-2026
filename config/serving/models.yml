# Per-model serving spec table, read by ragtime.serving.modelspec.
#
# Hand-authored and versioned. These are the integer dimensions the capacity calculator
# needs, so it never has to import transformers just to read a config.json. The file lives
# in config/serving/, so config.fairness.family_guard (which globs config/*.yml
# non-recursively) never sweeps it into a run family: it informs the authoring of the
# fairness-shared `llm` block, it does not make that block vary per node.
#
# MoE and hybrid models: params_total (all experts resident in VRAM) drives weights_bytes,
# while params_active is throughput-only. For a hybrid linear-attention plus
# full-attention model, n_full_attn_layers (< n_layers) is the only layer count that
# carries O(seq_len) KV, since the linear layers hold bounded recurrent state, so the KV
# term sums over n_full_attn_layers.

llm:
  # The production model (fairness-shared llm.model). Hybrid MoE, FP8. Dimensions are the
  # published config.json values for model_type qwen3_5_moe: 48 layers,
  # full_attention_interval 4 (every 4th layer from index 3 is full attention, so 12 of 48
  # carry KV), GQA 32/2 heads, head_dim 256.
  "Qwen/Qwen3.5-122B-A10B-FP8":
    dtype: fp8            # weights dtype, 1 byte/param (~113.7 GiB resident)
    kv_dtype: bf16        # KV stored in the activation dtype (2 bytes) on sm120
    params_total: 122000000000     # all 256 experts resident -> weights_bytes
    params_active: 10000000000     # 8-of-256 experts per token -> throughput only
    n_layers: 48
    n_full_attn_layers: 12         # full_attention_interval 4 -> 12 of 48 carry KV
    n_heads: 32                    # num_attention_heads
    n_kv_heads: 2                  # num_key_value_heads (GQA)
    head_dim: 256
    hidden_size: 3072
    context_window: 262144         # max_position_embeddings
    # Empirical conservative KV derate. A weights-only estimate predicts far more KV
    # tokens on 2 cards at TP=2 than vLLM actually allocates, because the MoE non-weight
    # overhead (attention workspace, NCCL buffers) is large. 0.20 keeps the pre-flight a
    # safe under-estimate; vLLM's own profiler is the arbiter (see capacity.py).
    kv_headroom_derate: 0.20

  # Dense GQA model used as the bring-up reference. Dense, so n_full_attn == n_layers.
  "Qwen/Qwen3-32B-FP8":
    dtype: fp8
    kv_dtype: bf16
    params_total: 32800000000
    params_active: 32800000000
    n_layers: 64
    n_full_attn_layers: 64
    n_heads: 64
    n_kv_heads: 8
    head_dim: 128
    hidden_size: 5120
    context_window: 32768
    # Dense model: the per-GPU overhead is already covered by the percentage activation
    # headroom, so no extra derate.
    kv_headroom_derate: 1.0

mt:
  # OMT arm: public, CT2-convertible, M2M100Config.
  "facebook/nllb-200-3.3B":
    dtype: bf16           # bf16 on Blackwell (sm120 INT8 disabled); float16 elsewhere
    params_total: 3300000000
    beam_size: 4
    max_seq_len: 512
    # Replica shapes: the acceptance set for role `translate`. The key
    # facebook/nllb-200-3.3B@translate is what execution.translate_shape_key names; the
    # measured batch knobs for each shape live in the shape_calibration block of the
    # per-cluster file beside this one.
    #
    # NLLB-200-3.3B in fp16 weighs ~6.1 GiB and fits on one card of every model in the
    # fleet, so there is nothing to tensor-shard and a translate shape is never
    # parallelism: tensor. Multi-GPU shapes are parallelism: data, meaning N independent
    # translators in one allocation; their only benefit is fewer, larger allocations and
    # their cost is that one crash takes N cards down, so they stay candidates.
    #
    # A shape is usable only once the calibration procedure has measured it and its row
    # shows semantic_composition_ok: true. The fairness-hashed bucket composition
    # (16384 tokens x 512 sentences) is identical on every card, so a card that cannot
    # host it is unusable however large its own ceiling is. Batch knobs come from those
    # measured rows, never from serving.capacity.mt_capacity().batch_size, which is orders
    # of magnitude too large. The RTX 3090 is absent because its ceiling (9216 max batch
    # tokens) is below the 16384 semantic budget, so CT2 would re-split every bucket and
    # the same shard would stop composing identically across cards.
    #
    # Authored in preference order, fastest expected card first.
    shapes:
      translate:
        - {name: bwx1,   gpu_model: nvidia_rtx_pro_6000_blackwell, gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64}
        - {name: h200x1, gpu_model: nvidia_h200_nvl,               gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64}
        - {name: h100x1, gpu_model: nvidia_h100_nvl,               gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64}
        - {name: a100x1, gpu_model: nvidia_a100_80gb_pcie,         gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64}
        - {name: 5090x1, gpu_model: nvidia_geforce_rtx_5090,       gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 48}
        # Post-calibration packaging option: four independent translators in one
        # allocation. Ranked below the single-GPU shapes.
        - {name: a100x4, gpu_model: nvidia_a100_80gb_pcie,         gpu_count: 4, parallelism: data, cpus_per_task: 16, mem_gb: 128, status: candidate}

  # Weak arm: OPUS-MT, three bilingual Marian checkpoints, one per direction. The key is a
  # family name rather than a Hugging Face repo id, and it is what
  # execution.translate_shape_key: "Helsinki-NLP/opus-mt@translate" names. One shared shape
  # set rather than three, because the checkpoints are architecturally identical (6 encoder
  # and 6 decoder layers, d_model 512, max_position_embeddings 512) and differ only in
  # vocabulary size, which is ~2.5 MB of fp16 weights.
  "Helsinki-NLP/opus-mt":
    dtype: fp16
    params_total: 77000000        # ~77 M per checkpoint, ~155 MB in fp16
    beam_size: 4
    max_seq_len: 512              # Marian's own max_position_embeddings, checked in each
                                  # checkpoint's config.json rather than inherited from NLLB
    # Replica shapes: the acceptance set for role `translate`. As with NLLB there is
    # nothing to tensor-shard, so every shape is parallelism: none. A worker holds up to
    # three resident translators (one per direction) when a shard spans a language
    # boundary, which is still under half a gigabyte.
    #
    # None of these has been calibrated for OPUS-MT. The NLLB rows in shape_calibration
    # are for a much larger model and say nothing about this one, so until a
    # Helsinki-NLP/opus-mt@translate block is measured and filed there, the operative bound
    # is the hashed translation.config.bucket_token_budget / max_sentences_per_bucket,
    # which the stage passes to CT2 directly.
    shapes:
      translate:
        - {name: bwx1,   gpu_model: nvidia_rtx_pro_6000_blackwell, gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64, status: uncalibrated}
        - {name: h200x1, gpu_model: nvidia_h200_nvl,               gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64, status: uncalibrated}
        - {name: h100x1, gpu_model: nvidia_h100_nvl,               gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64, status: uncalibrated}
        - {name: a100x1, gpu_model: nvidia_a100_80gb_pcie,         gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 64, status: uncalibrated}
        - {name: 5090x1, gpu_model: nvidia_geforce_rtx_5090,       gpu_count: 1, parallelism: none, cpus_per_task: 8, mem_gb: 48, status: uncalibrated}
